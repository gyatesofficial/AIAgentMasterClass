version: 2

sources:
  - name: shopstream_raw
    description: >
      Raw data loaded from ShopStream's operational PostgreSQL database via Fivetran.
      All timestamps are in UTC. Monetary values are stored in cents (integer).
    database: shopstream
    schema: raw
    loader: fivetran
    loaded_at_field: _fivetran_synced

    freshness:
      warn_after: {count: 12, period: hour}
      error_after: {count: 24, period: hour}

    tables:
      - name: customers
        description: One row per registered customer account.
        columns:
          - name: id
            description: Primary key — auto-incrementing integer from the source system.
            tests:
              - unique
              - not_null
          - name: email
            tests:
              - unique
              - not_null
          - name: created_at
            description: Timestamp when the account was created (UTC).
          - name: updated_at
            description: Timestamp of the last field change — used for incremental loads.

      - name: orders
        description: One row per order placed. Status transitions are tracked in the events table.
        freshness:
          warn_after: {count: 6, period: hour}   # orders must be fresher than customers
        columns:
          - name: id
            tests: [unique, not_null]
          - name: customer_id
            tests:
              - not_null
              - relationships:
                  to: source('shopstream_raw', 'customers')
                  field: id
          - name: status
            tests:
              - accepted_values:
                  values: ['placed', 'processing', 'completed', 'returned', 'cancelled']

      - name: order_items
        description: Line items for each order. One row per product per order.
        columns:
          - name: id
            tests: [unique, not_null]
          - name: order_id
            tests:
              - not_null
              - relationships:
                  to: source('shopstream_raw', 'orders')
                  field: id
          - name: unit_price_cents
            tests:
              - not_null
              - dbt_utils.expression_is_true:
                  expression: ">= 0"

      - name: products
        columns:
          - name: id
            tests: [unique, not_null]
          - name: sku
            tests: [unique, not_null]

      - name: payments
        description: One row per payment attempt. An order can have multiple attempts (e.g. retry after failure).
        columns:
          - name: id
            tests: [unique, not_null]
          - name: order_id
            tests:
              - not_null
              - relationships:
                  to: source('shopstream_raw', 'orders')
                  field: id
          - name: payment_method
            tests:
              - accepted_values:
                  values: "{{ var('payment_methods') }}"
          - name: status
            tests:
              - accepted_values:
                  values: ['success', 'failed', 'refunded', 'pending']
