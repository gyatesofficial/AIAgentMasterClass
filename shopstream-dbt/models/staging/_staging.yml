version: 2

models:
  - name: stg_customers
    description: >
      Cleaned and renamed customer records. One row per customer_id.
      Emails and names are lowercased and trimmed; country codes are uppercased.
    columns:
      - name: customer_id
        description: Primary key.
        tests: [unique, not_null]
      - name: email
        tests: [unique, not_null]
      - name: country_code
        tests:
          - not_null
          - accepted_values:
              values: ['US','UK','CA','AU','DE','SG','MX','FR','JP']
      - name: is_active
        tests: [not_null]

  - name: stg_orders
    description: One row per order. Includes derived date-grain columns and status booleans.
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: status
        tests:
          - accepted_values:
              values: ['placed','processing','completed','returned','cancelled']

  - name: stg_order_items
    description: One row per line item. Contains quantity, unit price, and line total in both cents and dollars.
    columns:
      - name: order_item_id
        tests: [unique, not_null]
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: quantity
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      - name: unit_price_cents
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

  - name: stg_products
    description: Cleaned product catalog. Prices in both cents and dollars.
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: sku
        tests: [unique, not_null]

  - name: stg_payments
    description: One row per payment attempt. A single order may have multiple rows (e.g. failed then retry).
    columns:
      - name: payment_id
        tests: [unique, not_null]
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: payment_method
        tests:
          - accepted_values:
              values: "{{ var('payment_methods') }}"
