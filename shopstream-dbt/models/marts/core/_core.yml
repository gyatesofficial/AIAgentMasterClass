version: 2

models:
  - name: dim_customers
    description: >
      Customer dimension table. One row per customer, enriched with lifetime
      order metrics and a customer tier classification. Safe to join to from
      any other mart model using customer_id.
    columns:
      - name: customer_id
        description: Primary key — surrogate from the source system.
        tests: [unique, not_null]
      - name: email
        tests: [unique, not_null]
      - name: customer_tier
        tests:
          - accepted_values:
              values: ['vip', 'regular', 'new', 'never_purchased']
      - name: lifetime_value
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"

  - name: fct_orders
    description: >
      Order fact table. One row per order (grain = order_id). The primary
      table for revenue analysis, order operations, and cohort studies.
      Revenue figures are in USD.
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: status
        tests:
          - accepted_values:
              values: ['placed','processing','completed','returned','cancelled']
      - name: revenue
        description: Order revenue in USD. Zero for cancelled/failed orders.
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"

  - name: dim_products
    description: Product dimension with sales summary statistics. One row per product_id.
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: sku
        tests: [unique, not_null]
