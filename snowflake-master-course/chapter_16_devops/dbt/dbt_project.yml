################################################################################
# Chapter 16: dbt Project Configuration
# Snowflake Master Course
################################################################################

name: 'snowflake_master_course'
version: '1.0.0'
config-version: 2

# This profile is referenced in ~/.dbt/profiles.yml
profile: 'snowflake_master_course'

################################################################################
# Directory structure
################################################################################
model-paths:      ["models"]
analysis-paths:   ["analyses"]
test-paths:       ["tests"]
seed-paths:       ["seeds"]
macro-paths:      ["macros"]
snapshot-paths:   ["snapshots"]

target-path:      "target"
clean-targets:    ["target", "dbt_packages"]

################################################################################
# Variables available in all models via {{ var('variable_name') }}
################################################################################
vars:
  # Cutoff date for incremental models – override in CI with --vars
  start_date:          '2024-01-01'
  end_date:            '{{ run_started_at.strftime("%Y-%m-%d") }}'
  # Which database to read raw source data from
  raw_database:        'ANALYTICS'
  raw_schema:          'RAW'
  # Number of days to look back for incremental refreshes
  incremental_lookback_days: 3

################################################################################
# Model-level defaults and overrides
################################################################################
models:
  snowflake_master_course:

    # ── Staging layer ─────────────────────────────────────────────────────────
    staging:
      +schema:       staging
      +database:     "{{ env_var('DBT_TARGET_DATABASE', 'ANALYTICS') }}"
      +warehouse:    TRANSFORM_WH
      +materialized: view          # Staging models are views (no storage cost)
      +tags:         ['staging']
      +docs:
        show: true

    # ── Intermediate layer ────────────────────────────────────────────────────
    intermediate:
      +schema:       intermediate
      +database:     "{{ env_var('DBT_TARGET_DATABASE', 'ANALYTICS') }}"
      +warehouse:    TRANSFORM_WH
      +materialized: ephemeral     # Compiled into downstream models – no table created
      +tags:         ['intermediate']

    # ── Marts layer ───────────────────────────────────────────────────────────
    marts:
      +schema:       marts
      +database:     "{{ env_var('DBT_TARGET_DATABASE', 'ANALYTICS') }}"
      +warehouse:    TRANSFORM_WH
      +materialized: table
      +tags:         ['marts']

      # Fact tables use incremental materialization for efficiency
      fct_orders:
        +materialized: incremental
        +incremental_strategy: merge
        +unique_key:   order_id
        +cluster_by:   ['order_date', 'region']

      # Dimension tables can be rebuilt on each run (small volume)
      dim_customers:
        +materialized: table
      dim_products:
        +materialized: table

################################################################################
# Seed configuration (CSV files in seeds/)
################################################################################
seeds:
  snowflake_master_course:
    +schema:   seeds
    +database: "{{ env_var('DBT_TARGET_DATABASE', 'ANALYTICS') }}"

    # Override column types for specific seed files
    country_codes:
      +column_types:
        country_code: varchar(2)
        country_name: varchar(100)

################################################################################
# Snapshot configuration
################################################################################
snapshots:
  snowflake_master_course:
    +target_schema: snapshots
    +target_database: "{{ env_var('DBT_TARGET_DATABASE', 'ANALYTICS') }}"
    +strategy: timestamp
    +updated_at: updated_at

################################################################################
# Test configuration
################################################################################
data_tests:
  +store_failures: true
  +schema: test_failures

################################################################################
# Source freshness
################################################################################
# Run with: dbt source freshness
# sources:
#   See models/staging/sources.yml for freshness definitions

################################################################################
# On-run hooks
################################################################################
on-run-start:
  - "ALTER SESSION SET QUERY_TAG = 'dbt_run'"

on-run-end:
  - "ALTER SESSION UNSET QUERY_TAG"
