################################################################################
# Chapter 16: Snowflake CI/CD Pipeline
# Snowflake Master Course
################################################################################
# What this pipeline does:
#   1. On every PR → run dbt compile + dbt test (CI gate)
#   2. On merge to main → run schemachange migrations → run dbt build (CD)
#   3. On schedule (nightly) → refresh dynamic tables + run full dbt build
#
# Required GitHub Secrets:
#   SNOWFLAKE_ACCOUNT          e.g. xy12345.us-east-1
#   SNOWFLAKE_USER             service account username
#   SNOWFLAKE_PRIVATE_KEY      PEM private key (RSA, base64-encoded)
#   SNOWFLAKE_ROLE             e.g. DBT_ROLE
#   SNOWFLAKE_WAREHOUSE        e.g. TRANSFORM_WH
#   SNOWFLAKE_DATABASE         e.g. ANALYTICS
#   SNOWFLAKE_SCHEMA           e.g. MARTS
#   DBT_PROFILES_YML           Full dbt profiles.yml content (for CI injection)
################################################################################

name: Snowflake CI/CD

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'chapter_16_devops/dbt/**'
      - 'chapter_16_devops/schemachange/**'
      - '.github/workflows/snowflake_ci_cd.yml'

  push:
    branches: [main]
    paths:
      - 'chapter_16_devops/dbt/**'
      - 'chapter_16_devops/schemachange/**'

  schedule:
    # Nightly full refresh at 02:00 UTC
    - cron: '0 2 * * *'

  workflow_dispatch:
    inputs:
      run_full_refresh:
        description: 'Run dbt with --full-refresh flag'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']
      target_environment:
        description: 'Target environment (dev/staging/prod)'
        required: false
        default: 'prod'
        type: choice
        options: ['dev', 'staging', 'prod']

################################################################################
# Global environment variables available to all jobs
################################################################################
env:
  DBT_PROJECT_DIR:     chapter_16_devops/dbt
  SCHEMACHANGE_DIR:    chapter_16_devops/schemachange
  PYTHON_VERSION:      "3.11"
  DBT_VERSION:         "1.8.0"
  SCHEMACHANGE_VERSION: "3.6.1"

################################################################################
# Job 1: Lint and validate SQL (runs on every PR)
################################################################################
jobs:

  lint:
    name: SQL Lint & dbt Compile
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dbt-snowflake
        run: |
          pip install --upgrade pip
          pip install dbt-snowflake==${{ env.DBT_VERSION }} sqlfluff sqlfluff-templater-dbt

      - name: Write dbt profiles.yml
        run: |
          mkdir -p ~/.dbt
          echo "${{ secrets.DBT_PROFILES_YML }}" > ~/.dbt/profiles.yml
        env:
          DBT_PROFILES_YML: ${{ secrets.DBT_PROFILES_YML }}

      - name: dbt deps (install packages)
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        run: dbt deps

      - name: dbt compile (parse all models without running)
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        run: dbt compile --profiles-dir ~/.dbt
        env:
          SNOWFLAKE_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER:      ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD:  ${{ secrets.SNOWFLAKE_PASSWORD }}
          DBT_TARGET_DATABASE: DEV_ANALYTICS

      - name: SQLFluff lint (check SQL style)
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        run: |
          sqlfluff lint models/ \
            --dialect snowflake \
            --templater dbt \
            --exclude-rules L016,L034 \
            --processes 4
        continue-on-error: true   # Warn, don't block on lint in PRs

################################################################################
# Job 2: dbt CI Tests (runs on PR against a dev schema)
################################################################################
  dbt_ci_test:
    name: dbt CI Tests
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dbt-snowflake
        run: pip install dbt-snowflake==${{ env.DBT_VERSION }}

      - name: Write dbt profiles.yml
        run: |
          mkdir -p ~/.dbt
          echo "${{ secrets.DBT_PROFILES_YML }}" > ~/.dbt/profiles.yml

      - name: dbt deps
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        run: dbt deps

      - name: dbt build – CI schema (staging + test)
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        run: |
          dbt build \
            --profiles-dir ~/.dbt \
            --target ci \
            --vars '{"start_date": "2024-01-01"}' \
            --select "staging marts" \
            --store-failures
        env:
          SNOWFLAKE_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER:      ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD:  ${{ secrets.SNOWFLAKE_PASSWORD }}
          DBT_TARGET_DATABASE: DEV_ANALYTICS

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-ci-artifacts
          path: |
            ${{ env.DBT_PROJECT_DIR }}/target/manifest.json
            ${{ env.DBT_PROJECT_DIR }}/target/run_results.json
          retention-days: 7

################################################################################
# Job 3: Run schemachange migrations (on merge to main)
################################################################################
  schemachange:
    name: schemachange Migrations
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install schemachange
        run: pip install schemachange==${{ env.SCHEMACHANGE_VERSION }}

      - name: Write Snowflake private key
        run: |
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" | base64 --decode > /tmp/snowflake_rsa_key.p8
          chmod 600 /tmp/snowflake_rsa_key.p8

      - name: Run schemachange migrations
        run: |
          schemachange deploy \
            --snowflake-account   "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --snowflake-user      "${{ secrets.SNOWFLAKE_USER }}" \
            --snowflake-role      "${{ secrets.SNOWFLAKE_ROLE }}" \
            --snowflake-warehouse "${{ secrets.SNOWFLAKE_WAREHOUSE }}" \
            --snowflake-database  "${{ secrets.SNOWFLAKE_DATABASE }}" \
            --change-history-table ANALYTICS.SCHEMACHANGE.CHANGE_HISTORY \
            --root-folder         "${{ env.SCHEMACHANGE_DIR }}" \
            --private-key-path    /tmp/snowflake_rsa_key.p8 \
            --verbose

      - name: Clean up private key
        if: always()
        run: rm -f /tmp/snowflake_rsa_key.p8

################################################################################
# Job 4: dbt Production Deploy (runs after successful schemachange)
################################################################################
  dbt_deploy:
    name: dbt Production Deploy
    runs-on: ubuntu-latest
    needs: schemachange
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dbt-snowflake
        run: pip install dbt-snowflake==${{ env.DBT_VERSION }}

      - name: Write dbt profiles.yml
        run: |
          mkdir -p ~/.dbt
          echo "${{ secrets.DBT_PROFILES_YML }}" > ~/.dbt/profiles.yml

      - name: dbt deps
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        run: dbt deps

      - name: dbt build – production
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        run: |
          FULL_REFRESH_FLAG=""
          if [[ "${{ github.event.inputs.run_full_refresh }}" == "true" ]]; then
            FULL_REFRESH_FLAG="--full-refresh"
          fi

          dbt build \
            --profiles-dir ~/.dbt \
            --target prod \
            $FULL_REFRESH_FLAG \
            --vars '{"start_date": "2024-01-01"}' \
            --store-failures
        env:
          SNOWFLAKE_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER:      ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD:  ${{ secrets.SNOWFLAKE_PASSWORD }}
          DBT_TARGET_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}

      - name: Upload dbt prod artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-prod-artifacts
          path: |
            ${{ env.DBT_PROJECT_DIR }}/target/manifest.json
            ${{ env.DBT_PROJECT_DIR }}/target/run_results.json
          retention-days: 30

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              body:         '❌ **dbt production deploy failed.** Check the [Actions run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            })

################################################################################
# Job 5: Nightly full refresh (scheduled)
################################################################################
  nightly_refresh:
    name: Nightly Full Refresh
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dbt-snowflake
        run: pip install dbt-snowflake==${{ env.DBT_VERSION }}

      - name: Write dbt profiles.yml
        run: |
          mkdir -p ~/.dbt
          echo "${{ secrets.DBT_PROFILES_YML }}" > ~/.dbt/profiles.yml

      - name: dbt deps
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        run: dbt deps

      - name: dbt run – nightly incremental
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        run: |
          dbt run \
            --profiles-dir ~/.dbt \
            --target prod \
            --select "marts" \
            --vars '{"start_date": "2024-01-01", "incremental_lookback_days": 1}'
        env:
          SNOWFLAKE_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER:      ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD:  ${{ secrets.SNOWFLAKE_PASSWORD }}
          DBT_TARGET_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}

      - name: dbt test – marts only
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        run: |
          dbt test \
            --profiles-dir ~/.dbt \
            --target prod \
            --select "marts"
        env:
          SNOWFLAKE_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER:      ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD:  ${{ secrets.SNOWFLAKE_PASSWORD }}
          DBT_TARGET_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
